services:
  - type: web
    name: messenger-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_gcServer
        value: "0"
      - key: DOTNET_GCHeapHardLimit
        value: "0x14000000"
      - key: DOTNET_EnableDiagnostics
        value: "0"
      - key: USE_SQLITE
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        value: "Data Source=/app/messenger.db"
      - key: Jwt__SecretKey
        generateValue: true
      - key: Jwt__Issuer
        value: "MessengerApi"
      - key: Jwt__Audience
        value: "MessengerClients"
