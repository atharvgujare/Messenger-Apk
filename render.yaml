services:
  - type: web
    name: messenger-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_gcServer
        value: "0"
      - key: DOTNET_GCHeapHardLimit
        value: "0x14000000"
      - key: DOTNET_EnableDiagnostics
        value: "0"
      - key: USE_SQLITE
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        value: "Data Source=/app/messenger.db"
      - key: JwtSettings__Secret
        generateValue: true
      - key: JwtSettings__Issuer
        value: "MessengerApi"
      - key: JwtSettings__Audience
        value: "MessengerClients"
      - key: Smtp__Host
        value: "smtp.gmail.com"
      - key: Smtp__Port
        value: "587"
      - key: Smtp__Username
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__FromEmail
        sync: false
